services:
  backend:
    build:
      context: ./backend
    container_name: dogfood-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dogfood-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped